<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapFlow Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="SnapFlow Logo" class="brand-icon">
        <div class="brand-text">
          <div style="display: flex; align-items: center; gap: 6px;">
            <h1 class="brand-title">SnapFlow</h1>
            <a href="https://www.baziqhue.co.ke" target="_blank" rel="noopener" id="btn-parent-brand" style="font-size: 10px; color: #38bdf8; text-decoration: none; background: rgba(56,189,248,0.12); padding: 1px 6px; border-radius: 8px; border: 1px solid rgba(56,189,248,0.3); font-weight: 500;" title="BaziQ Hue — Official Parent Brand">by BaziQ Hue</a>
          </div>
          <span class="brand-badge">Local &bull; Private</span>
        </div>
      </div>
      <div class="header-buttons" style="display: flex; gap: 6px; align-items: center;">
        <button id="btn-open-website" class="icon-btn" title="SnapFlow Public Website & Docs" aria-label="Visit Website">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>
        <button id="btn-open-studio" class="icon-btn" title="Open Studio Workspace" aria-label="Open Studio Workspace">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Error / Warning Banner (Hidden by default) -->
    <div id="error-banner" class="banner banner-error hidden" role="alert">
      <svg class="banner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div id="error-message" class="banner-text">Cannot capture this page.</div>
    </div>

    <!-- Active Capture Progress View (Hidden by default) -->
    <div id="capture-progress-view" class="progress-view hidden">
      <div class="progress-header">
        <span id="progress-state-label" class="progress-state">Analyzing page...</span>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div class="progress-details">
        <span id="progress-step-info">Preparing viewport</span>
        <button id="btn-cancel-capture" class="btn-cancel">Cancel</button>
      </div>
    </div>

    <!-- Main Capture Action Buttons -->
    <main id="capture-actions" class="capture-actions">
      <!-- Full Page (Hero) -->
      <button id="btn-capture-full" class="action-card hero-action" data-mode="full">
        <div class="action-icon hero-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </div>
        <div class="action-content">
          <div class="action-title-row">
            <span class="action-title">Full Page</span>
            <span class="shortcut-tag">Alt+Shift+S</span>
          </div>
          <span class="action-desc">Scroll & stitch complete webpage</span>
        </div>
      </button>

      <!-- Visible Area -->
      <button id="btn-capture-visible" class="action-card" data-mode="visible">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <div class="action-content">
          <div class="action-title-row">
            <span class="action-title">Visible Area</span>
            <span class="shortcut-tag">Alt+Shift+V</span>
          </div>
          <span class="action-desc">Current viewport instantly</span>
        </div>
      </button>

      <!-- Selected Area -->
      <button id="btn-capture-selected" class="action-card" data-mode="selected">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3H3v2"></path>
            <path d="M9 3h2"></path>
            <path d="M15 3h2"></path>
            <path d="M19 3h2v2"></path>
            <path d="M21 9v2"></path>
            <path d="M21 15v2"></path>
            <path d="M21 19v2h-2"></path>
            <path d="M15 21h-2"></path>
            <path d="M9 21H7"></path>
            <path d="M3 21v-2h2"></path>
            <path d="M3 15v-2"></path>
            <path d="M3 9V7"></path>
          </svg>
        </div>
        <div class="action-content">
          <div class="action-title-row">
            <span class="action-title">Selected Area</span>
          </div>
          <span class="action-desc">Drag custom rectangle marquee</span>
        </div>
      </button>

      <!-- Scrolling Element -->
      <button id="btn-capture-element" class="action-card" data-mode="element">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="action-content">
          <div class="action-title-row">
            <span class="action-title">Scrolling Region</span>
          </div>
          <span class="action-desc">Click chat panel, table, or code block</span>
        </div>
      </button>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-status">
        <span class="status-indicator"></span>
        <span>Zero Telemetry &bull; 100% Free</span>
      </div>
      <div class="footer-actions" style="display: flex; gap: 8px; align-items: center;">
        <button id="btn-open-privacy" class="icon-link" title="Privacy Policy (Local Processing)" aria-label="Privacy Policy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </button>
        <button id="btn-open-support" class="icon-link" title="Support & Help" aria-label="Support & Help">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
        <button id="btn-settings-toggle" class="icon-link" title="Capture Settings" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Settings Drawer (Hidden by default) -->
    <div id="settings-drawer" class="settings-drawer hidden">
      <div class="settings-header">
        <h2>Capture Settings</h2>
        <button id="btn-close-settings" class="icon-btn-sm">&times;</button>
      </div>
      <div class="setting-item">
        <label for="setting-scroll-delay">Scroll Settle Delay (ms)</label>
        <input type="number" id="setting-scroll-delay" min="100" max="1000" step="50" value="200">
      </div>
      <div class="setting-item">
        <label for="setting-hide-fixed">Smart Hide Sticky Headers</label>
        <input type="checkbox" id="setting-hide-fixed" checked>
      </div>
      <div class="setting-item">
        <label for="setting-preflight">Pre-flight Lazy Load Sweep</label>
        <input type="checkbox" id="setting-preflight" checked>
      </div>
      <div class="setting-item">
        <label for="setting-default-format">Default Export Format</label>
        <select id="setting-default-format">
          <option value="png">PNG (Lossless)</option>
          <option value="jpeg">JPEG (Compressed)</option>
          <option value="pdf">Smart-Split PDF</option>
        </select>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
